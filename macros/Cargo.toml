[package]
name = "o11y-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Procedural macros for the `o11y` feature of `rust-sak`. Not useful on its own."
repository.workspace = true
license.workspace = true
publish = false

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
# `full` is what brings in `ItemFn`, which is the whole point of the crate.
syn = { version = "2.0", features = ["full"] }

[lints]
workspace = true
