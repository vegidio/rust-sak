# `macros/` holds the `o11y-macros` package, which supplies the `#[instrument]` attribute for `o11y`. A proc-macro
# crate cannot be a module of a normal crate, so it has to be a sibling package, which in turn makes this a
# workspace.
[workspace]
members = ["macros"]

# Shared by both members so a release only has to bump one place.
[workspace.package]
version = "26.9.5"
edition = "2024"
rust-version = "1.95"
repository = "https://github.com/vegidio/rust-sak"
license = "Apache-2.0"

[package]
name = "rust-sak"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A Swiss Army Knife of reusable Rust building blocks: hashing, HTTP fetching, hardened archive extraction, image codecs, memoization, OTLP telemetry and hardware probes - each behind its own feature."
repository.workspace = true
license.workspace = true
readme = "README.md"
# Not published: `o11y-macros` is depended on by path, which `cargo publish` rejects. Consumers take this crate
# as a git dependency, where cargo clones the whole repository and the path resolves.
publish = false
keywords = ["utility", "toolkit", "filesystem", "cache", "telemetry"]
categories = ["development-tools", "filesystem", "caching", "multimedia::images"]

[package.metadata.docs.rs]
# The crate has no default features, so docs.rs would otherwise render an empty page.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# Hoisted to the workspace so `macros` is held to the same standard; each member opts in with
# `[lints] workspace = true`.
[workspace.lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
missing_errors_doc = "warn"
missing_panics_doc = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"

[lints]
workspace = true

[dependencies]
avif = { package = "avif-rs", version = "26.7.1", optional = true }
cap-std = { version = "4.0.3", optional = true }
dirs = { version = "7.0", optional = true }
enough = { version = "0.4", default-features = false, optional = true }
futures-util = { version = "0.3", default-features = false, optional = true }
heif = { package = "heif-rs", version = "26.7", optional = true }
hex = { version = "0.4.3", optional = true }
hmac = { version = "0.13.0", optional = true }
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff"], optional = true }
liblzma = { version = "0.4", default-features = false, features = ["static"], optional = true }
machine-uid = { version = "0.6.0", optional = true }
moka = { version = "0.12.16", default-features = false, features = ["sync"], optional = true }
# Deliberately carries no `version`, so it always resolves to the sibling directory. That blocks `cargo publish`,
# which this crate does not do - it is consumed as a git dependency, and cargo clones the whole repository, so the
# path is there.
o11y-macros = { path = "macros", optional = true }
pin-project-lite = { version = "0.2.17", optional = true }
postcard = { version = "1.1.3", default-features = false, features = ["use-std"], optional = true }
redb = { version = "4.2.0", default-features = false, optional = true }
reqwest = { version = "0.13.4", features = ["query", "json", "stream"], optional = true }
serde = { version = "1.0.228", features = ["derive"], optional = true }
serde_json = { version = "1.0.150", optional = true }
sevenz-rust2 = { version = "0.22", optional = true }
sha2 = { version = "0.11.0", optional = true }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"], optional = true }
tar = { version = "0.4", optional = true }
tempfile = { version = "3.27", optional = true }
thiserror = { version = "2.0.20", optional = true }
tokio = { version = "1.52.3", features = ["time", "rt-multi-thread", "macros", "fs", "io-util", "sync"], optional = true }
twox-hash = { version = "2.1.2", default-features = false, features = ["xxhash3_64", "alloc"], optional = true }
uuid = { version = "1.26.0", default-features = false, features = ["v4"], optional = true }
walkdir = { version = "2.5", optional = true }
webp = { package = "webp-rs", version = "26.7", optional = true }
zenpixels = { version = "0.2", default-features = false, optional = true }
zenraw = { version = "0.2", default-features = false, features = ["rawler", "rawloader"], optional = true }
zip = { version = "8.6", default-features = false, features = [
    "aes-crypto",
    "bzip2",
    "deflate-flate2-zlib-rs",
    "lzma",
    "xz",
    "zstd",
], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "CFBase",
    "CFData",
    "CFDictionary",
    "CFNumber",
    "CFString",
], optional = true }
objc2-io-kit = { version = "0.3.2", default-features = false, features = ["std", "libc"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics",
    "Win32_Graphics_Dxgi",
], optional = true }

[dev-dependencies]
tempfile = "3.27"
tokio = { version = "1.52.3", features = ["macros", "rt", "time", "test-util", "net", "io-util"] }

[features]
default = []
crypto = ["dep:sha2", "dep:hex", "dep:twox-hash"]
# `sha2`/`hex` are here for `RequestOptions::digest`, which hashes a transfer's bytes as they are written.
fetch = ["dep:reqwest", "dep:tokio", "dep:serde", "dep:serde_json", "dep:futures-util", "dep:sha2", "dep:hex"]
fs = [
    "dep:cap-std",
    "dep:dirs",
    "dep:liblzma",
    "dep:sevenz-rust2",
    "dep:tar",
    "dep:tempfile",
    "dep:thiserror",
    "dep:walkdir",
    "dep:zip",
]
image = ["dep:image", "dep:webp", "dep:avif", "dep:heif", "dep:thiserror"]
image-raw = ["image", "dep:zenraw", "dep:zenpixels", "dep:enough"]
memo = ["dep:hex", "dep:moka", "dep:postcard", "dep:redb", "dep:serde", "dep:serde_json", "dep:sha2", "dep:thiserror"]
memo-async = ["memo", "dep:tokio"]
# `reqwest/blocking` rather than the async client: the export worker owns a dedicated OS thread, so it never
# competes with the calling application's async runtime - and the feature stays usable without one.
o11y = [
    "dep:hex",
    "dep:hmac",
    "dep:machine-uid",
    "dep:o11y-macros",
    "dep:pin-project-lite",
    "dep:reqwest",
    "dep:serde",
    "dep:serde_json",
    "dep:sha2",
    "dep:thiserror",
    "dep:uuid",
    "reqwest/blocking",
]
sysinfo = ["dep:objc2-core-foundation", "dep:objc2-io-kit", "dep:sysinfo", "dep:thiserror", "dep:windows"]

# Mirrors the `required-features` the `playground` target carried as a `[[bin]]`: without this, a
# build with any other feature set tries to compile it and fails on the missing `fetch` module.
[[example]]
name = "playground"
required-features = ["fetch"]
