[package]
name = "rust-sak"
version = "1.0.0"
edition = "2024"

[dependencies]
avif = { package = "avif-rs", version = "26.7.1", optional = true }
futures-util = { version = "0.3", default-features = false, optional = true }
heif = { package = "heif-rs", version = "26.7", optional = true }
hex = { version = "0.4.3", optional = true }
hmac = { version = "0.13.0", optional = true }
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff"], optional = true }
machine-uid = { version = "0.6.0", optional = true }
opentelemetry = { version = "0.32.0", default-features = false, features = ["logs"], optional = true }
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["http-proto", "logs", "reqwest-blocking-client"], optional = true }
opentelemetry_sdk = { version = "0.32.1", default-features = false, features = ["logs"], optional = true }
reqwest = { version = "0.13.4", features = ["query", "json", "stream"], optional = true }
serde = { version = "1.0.228", features = ["derive"], optional = true }
serde_json = { version = "1.0.150", optional = true }
sha2 = { version = "0.11.0", optional = true }
tokio = { version = "1.52.3", features = ["time", "rt-multi-thread", "macros", "fs", "io-util", "sync"], optional = true }
twox-hash = { version = "2.1.2", default-features = false, features = ["xxhash3_64", "alloc"], optional = true }
uuid = { version = "1.26.0", default-features = false, features = ["v4"], optional = true }
webp = { package = "webp-rs", version = "26.7", optional = true }

[dev-dependencies]
tokio = { version = "1.52.3", features = ["macros", "rt", "time", "test-util", "net", "io-util"] }

[features]
default = []
crypto = ["dep:sha2", "dep:hex", "dep:twox-hash"]
fetch = ["dep:reqwest", "dep:tokio", "dep:serde", "dep:serde_json", "dep:futures-util"]
image = ["dep:image", "dep:webp", "dep:avif", "dep:heif"]
o11y = [
    "dep:hex",
    "dep:hmac",
    "dep:machine-uid",
    "dep:opentelemetry",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry_sdk",
    "dep:reqwest",
    "dep:serde",
    "dep:serde_json",
    "dep:sha2",
    "dep:uuid",
    "reqwest/blocking",
]

[[bin]]
name = "playground"
path = "src/main.rs"
required-features = ["fetch"]
