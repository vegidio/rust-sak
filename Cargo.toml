# `macros/` holds the `o11y-macros` package, which supplies the `#[instrument]` attribute for `o11y`. A proc-macro
# crate cannot be a module of a normal crate, so it has to be a sibling package, which in turn makes this a
# workspace.
[workspace]
members = ["macros"]

# Shared by both members so a release only has to bump one place.
[workspace.package]
version = "26.10.9"
edition = "2024"
rust-version = "1.95"
repository = "https://github.com/vegidio/rust-sak"
license = "Apache-2.0"

[package]
name = "rust-sak"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A Swiss Army Knife of reusable Rust building blocks: hashing, HTTP fetching, hardened archive extraction, image codecs, memoization, OTLP telemetry and hardware probes - each behind its own feature."
repository.workspace = true
license.workspace = true
readme = "README.md"
# Not published: `o11y-macros` is depended on by path, which `cargo publish` rejects. Consumers take this crate
# as a git dependency, where cargo clones the whole repository and the path resolves.
publish = false
keywords = ["utility", "toolkit", "filesystem", "cache", "telemetry"]
categories = ["development-tools", "filesystem", "caching", "multimedia::images"]

[package.metadata.docs.rs]
# The crate has no default features, so docs.rs would otherwise render an empty page.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# Hoisted to the workspace so `macros` is held to the same standard; each member opts in with
# `[lints] workspace = true`.
[workspace.lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
missing_errors_doc = "warn"
missing_panics_doc = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"

[lints]
workspace = true

[dependencies]
avif = { package = "avif-rs", version = "26.10.3", optional = true }
cap-std = { version = "4.0.3", optional = true }
# Runs ONNX Runtime's telemetry opt-out under `ai` before `main`, while no other thread can read the environment.
ctor = { version = "1", optional = true }
dirs = { version = "7.0", optional = true }
enough = { version = "0.4", default-features = false, optional = true }
futures-util = { version = "0.3", default-features = false, optional = true }
heif = { package = "heif-rs", version = "26.10.3", optional = true }
hex = { version = "0.4.3", optional = true }
hmac = { version = "0.13.0", optional = true }
# Only to rebuild a `reqwest::Response` around a body read under `max_body_bytes`; already in the tree through `reqwest`.
http = { version = "1", optional = true }
# Parses the date form of `Retry-After`.
httpdate = { version = "1.0.3", optional = true }
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff"], optional = true }
liblzma = { version = "0.4", default-features = false, features = ["static"], optional = true }
machine-uid = { version = "0.6.0", optional = true }
moka = { version = "0.12.16", default-features = false, features = ["sync"], optional = true }
# Deliberately carries no `version`, so it always resolves to the sibling directory. That blocks `cargo publish`,
# which this crate does not do - it is consumed as a git dependency, and cargo clones the whole repository, so the
# path is there.
o11y-macros = { path = "macros", optional = true }
# Inference for `ai`, on an ONNX Runtime downloaded at run time. A pre-release, so pinned exactly, and every consumer of
# `ai` builds this same `ort`. No defaults: `download-binaries` and `copy-dylibs` would fetch a second runtime at build
# time, and the default `api-31` would refuse the 1.30.0 runtime `ai` installs. `load-dynamic` opens that runtime at a
# path chosen at run time; `tracing` routes its logs to `tracing` instead of stderr.
ort = { version = "=2.0.0-rc.15", default-features = false, features = [
    "std",
    "load-dynamic",
    "api-30",
    "tracing",
], optional = true }
pin-project-lite = { version = "0.2.17", optional = true }
postcard = { version = "1.1.3", default-features = false, features = ["use-std"], optional = true }
# Only the `crossterm` backend: `tui` draws one inline line, and the default `all-widgets`, `macros` and
# `underline-color` set is all unused here.
ratatui = { version = "0.30", default-features = false, features = ["crossterm"], optional = true }
# Named only for `scrolling-regions`, which `tui` does not use, but which adds two required methods to ratatui's
# `Backend` trait. `tui` implements that trait, so the feature is turned on in every build: otherwise a consumer that
# enables it elsewhere in its graph (features unify) would leave `tui`'s backend missing them. Turned on here rather
# than through `ratatui`, whose feature also names its other backends and so puts them all in the lock file.
ratatui-crossterm = { version = "0.1.2", default-features = false, features = [
    "crossterm_0_29",
    "scrolling-regions",
], optional = true }
redb = { version = "4.2.0", default-features = false, optional = true }
reqwest = { version = "0.13.4", features = ["query", "json", "stream"], optional = true }
serde = { version = "1.0.228", features = ["derive"], optional = true }
serde_json = { version = "1.0.150", optional = true }
semver = { version = "1", optional = true }
sevenz-rust2 = { version = "0.24", optional = true }
# SHA-1 and the git blob hash under `crypto`: Git and Hugging Face name a file outside LFS by its git blob SHA-1.
sha1 = { version = "0.11.0", optional = true }
sha2 = { version = "0.11.0", optional = true }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"], optional = true }
tar = { version = "0.4", optional = true }
tempfile = { version = "3.27", optional = true }
thiserror = { version = "2.0.20", optional = true }
tokio = { version = "1.52.3", features = ["time", "rt-multi-thread", "macros", "fs", "io-util", "sync"], optional = true }
tracing = { version = "0.1.44", default-features = false, features = ["std"], optional = true }
# `registry` is what names `LookupSpan` and span extensions, which is where the bridge keeps each span's state.
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"], optional = true }
twox-hash = { version = "2.1.2", default-features = false, features = ["xxhash3_64", "alloc"], optional = true }
uuid = { version = "1.26.0", default-features = false, features = ["v4"], optional = true }
walkdir = { version = "2.5", optional = true }
webp = { package = "webp-rs", version = "26.10.3", optional = true }
zenpixels = { version = "0.2", default-features = false, optional = true }
zenraw = { version = "0.2", default-features = false, features = ["rawler", "rawloader"], optional = true }
zip = { version = "9", default-features = false, features = [
    "aes-crypto",
    "bzip2",
    "deflate-flate2-zlib-rs",
    "lzma",
    "xz",
    "zstd",
], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# `fs::move_to_trash` asks `NSFileManager` itself on macOS, since `trash` drops where the item went, which
# `fs::restore_from_trash` needs. These are the versions `trash` uses elsewhere.
objc2 = { version = "0.6.2", optional = true }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "CFBase",
    "CFData",
    "CFDictionary",
    "CFNumber",
    "CFString",
], optional = true }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "FoundationErrors",
    "NSError",
    "NSFileManager",
    "NSString",
    "NSURL",
], optional = true }
objc2-io-kit = { version = "0.3.2", default-features = false, features = ["std", "libc"], optional = true }

# Only Windows, Linux and the BSDs: on macOS `fs` reaches the Trash through `objc2-foundation` above.
[target.'cfg(not(target_os = "macos"))'.dependencies]
trash = { version = "5.2.9", optional = true }

[target.'cfg(unix)'.dependencies]
# `poll`, for `tui` to wait on the terminal's reply to a cursor-position query with a timeout. crossterm already brings
# it in, so it adds no crate.
libc = { version = "0.2", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# `dl_iterate_phdr` and the `RTLD_NOLOAD`/`RTLD_NODELETE` flags, which pin the drivers the WebGPU probe loads. The flag
# values differ between architectures, so they are taken from here rather than written down.
libc = { version = "0.2", optional = true }

# NVML, the NVIDIA GPU probe behind `sysfs`, the Vulkan loader, the WebGPU probe, and the CUDA driver, the CUDA probe,
# are loaded at runtime: a machine without the NVIDIA driver has no `libnvidia-ml.so.1` or `nvcuda.dll`, one without
# Vulkan no `libvulkan.so.1`, and linking against any of them would stop this crate loading there at all.
[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
libloading = { version = "0.9", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics",
    "Win32_Graphics_Dxgi",
], optional = true }

[dev-dependencies]
rayon = "1.12"
tempfile = "3.27"
tokio = { version = "1.52.3", features = ["macros", "rt", "time", "test-util", "net", "io-util"] }

[features]
default = []
crypto = ["dep:sha1", "dep:sha2", "dep:hex", "dep:twox-hash"]
# `sha2`/`hex` are here for `RequestOptions::digest`, which hashes a transfer's bytes as they are written.
fetch = [
    "dep:futures-util",
    "dep:hex",
    "dep:http",
    "dep:httpdate",
    "dep:reqwest",
    "dep:serde",
    "dep:serde_json",
    "dep:sha2",
    "dep:tokio",
]
fs = [
    "dep:cap-std",
    "dep:dirs",
    "dep:liblzma",
    "dep:objc2",
    "dep:objc2-foundation",
    "dep:sevenz-rust2",
    "dep:tar",
    "dep:tempfile",
    "dep:thiserror",
    "dep:trash",
    "dep:walkdir",
    "dep:zip",
]
image = ["dep:image", "dep:webp", "dep:avif", "dep:heif", "dep:thiserror"]
image-raw = ["image", "dep:zenraw", "dep:zenpixels", "dep:enough"]
memo = ["dep:hex", "dep:moka", "dep:postcard", "dep:redb", "dep:serde", "dep:serde_json", "dep:sha2", "dep:thiserror"]
memo-async = ["memo", "dep:tokio"]
# `reqwest/blocking` rather than the async client: the export worker owns a dedicated OS thread, so it never
# competes with the calling application's async runtime - and the feature stays usable without one.
o11y = [
    "dep:hex",
    "dep:hmac",
    "dep:machine-uid",
    "dep:o11y-macros",
    "dep:pin-project-lite",
    "dep:reqwest",
    "dep:serde",
    "dep:serde_json",
    "dep:sha2",
    "dep:thiserror",
    "dep:uuid",
    "reqwest/blocking",
]
# The bridge from `tracing` into `o11y`, apart from `o11y` itself so a program that does not log through `tracing`
# compiles none of it.
o11y-tracing = ["o11y", "dep:tracing", "dep:tracing-subscriber"]
# Built on `fetch`: the GitHub API is a plain JSON endpoint, so it reuses `Fetch::json` and its retries.
github = ["fetch", "dep:semver", "dep:serde", "dep:thiserror"]
sysinfo = [
    "dep:libc",
    "dep:libloading",
    "dep:objc2-core-foundation",
    "dep:objc2-io-kit",
    "dep:sysinfo",
    "dep:thiserror",
    "dep:windows",
]
# Installs the ONNX Runtime and the NVIDIA libraries from Hugging Face folders the caller names, and loads the runtime.
# `fetch` for the API and the downloads, `fs` to extract, `crypto` to verify, `sysinfo` to decide on the GPU libraries.
ai = [
    "crypto",
    "fetch",
    "fs",
    "sysinfo",
    "dep:ctor",
    "dep:ort",
    "dep:serde",
    "dep:thiserror",
    "dep:tokio",
    "dep:tracing",
]
# A one-line gradient progress bar drawn with `ratatui` in an inline viewport, on stdout or stderr.
tui = ["dep:libc", "dep:ratatui", "dep:ratatui-crossterm"]

# Mirrors the `required-features` the `playground` target carried as a `[[bin]]`: without this, a
# build with any other feature set tries to compile it and fails on the missing `fetch` module.
[[example]]
name = "playground"
required-features = ["fetch"]

[[example]]
name = "tui"
required-features = ["tui"]

[[example]]
name = "tui_rows"
required-features = ["tui"]

[[example]]
name = "tui_spinner"
required-features = ["tui"]
