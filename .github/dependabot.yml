version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    # CI builds with `--locked` everywhere, so the lockfile has to be refreshed deliberately rather than drifting.
    versioning-strategy: increase
    open-pull-requests-limit: 5
    groups:
      # Patch and minor bumps are almost always mechanical; batching them keeps the PR queue readable while leaving
      # every major to arrive on its own, where it can be reviewed against the API it changes.
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
