name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy

      - name: Lint
        run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings

  # `cargo test --doc` compiles the examples inside doc comments but says nothing about the prose around them, so
  # a link to a renamed or private item fails silently and ships to docs.rs as plain text. Only rustdoc itself
  # reports those, and only when asked — hence this job rather than a flag on an existing one.
  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: docs

      # `--no-deps` keeps this about this crate's own documentation; a broken link in a dependency is not
      # actionable here. `private_intra_doc_links` catches the subtler half: a link that resolves for the author,
      # because the target is visible inside the crate, but renders as bare text for everyone reading docs.rs.
      - name: Build the documentation
        env:
          RUSTDOCFLAGS: -D warnings -D rustdoc::broken_intra_doc_links -D rustdoc::private_intra_doc_links
        run: cargo doc --workspace --all-features --no-deps --locked

  # Every feature is meant to be usable on its own, so each one is compiled on its own. `--all-features` alone would
  # hide a feature that only builds because a sibling happened to pull in what it needs.
  features:
    name: feature (${{ matrix.feature }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        feature:
          - crypto
          - fetch
          - fs
          - github
          - image
          - image-raw
          - memo
          - memo-async
          - o11y
          - sysinfo
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: features

      - name: Check the feature on its own
        run: cargo check --no-default-features --features ${{ matrix.feature }} --locked

  # The crate has no default features, so this compiles the bare skeleton and nothing else.
  no-features:
    name: no features
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: features

      - name: Check with no features
        run: cargo check --no-default-features --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Checks the dependency tree rather than this crate's own code, so it needs no toolchain cache and no build.
      # `--all-features` is what makes it see every optional dependency; the default feature set is empty.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --all-features
          command: check advisories bans

  msrv:
    # The version is written out twice rather than held in an `env:`, because the `env` context is not available in a
    # job's `name:` — using it there is rejected as an invalid workflow expression before any job runs. Both must be
    # kept in step with `rust-version` in Cargo.toml, which `sysinfo` sets.
    name: msrv (1.95)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"

      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv

      # A compile is enough: `rust-version` is a claim about what the crate builds on, and nothing else verifies it.
      - name: Check on the minimum supported Rust version
        run: cargo check --workspace --all-features --all-targets --locked

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        # windows-latest defaults to pwsh, whose `>>` writes UTF-16LE and would corrupt $GITHUB_ENV. The
        # `tee` pipelines below also assume a POSIX shell.
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # The avif/heif/webp crates run bindgen in their build scripts. Linux and macOS runners resolve libclang on
      # their own; Windows needs to be told where it lives.
      - name: Point bindgen at libclang
        if: runner.os == 'Windows'
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          key: test

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # The crate has no default features, so a bare `cargo test` would compile nothing.
      - name: Run unit tests
        id: nextest
        run: cargo nextest run --workspace --all-features --locked --no-fail-fast 2>&1 | tee nextest.log

      # nextest cannot run doctests, and this crate has plenty; without this they stop being compiled at all.
      - name: Run doctests
        id: doctest
        if: ${{ !cancelled() }}
        run: cargo test --doc --all-features --locked 2>&1 | tee doctest.log

      - name: Publish results to job summary
        if: ${{ !cancelled() }}
        uses: ./.github/actions/test-summary
        with:
          os: ${{ matrix.os }}
          unit-outcome: ${{ steps.nextest.outcome }}
          doctest-outcome: ${{ steps.doctest.outcome }}

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage
          # cargo-llvm-cov relocates the target dir; the default `. -> target` would cache the wrong one.
          workspaces: ". -> target/llvm-cov-target"

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest

      # `--no-report` keeps the profdata so the four report formats the next step renders cost no rebuild and no
      # second test run.
      - name: Run instrumented tests
        run: cargo llvm-cov nextest --workspace --all-features --locked --no-fail-fast --no-report

      - name: Generate reports
        id: reports
        if: ${{ !cancelled() }}
        uses: ./.github/actions/coverage-reports

      - name: Publish coverage to job summary
        if: ${{ steps.reports.outcome == 'success' }}
        uses: ./.github/actions/coverage-summary
        with:
          summary-json: ${{ steps.reports.outputs.summary-json }}
          summary-txt: ${{ steps.reports.outputs.summary-txt }}

      - name: Upload lcov
        if: ${{ steps.reports.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: ${{ steps.reports.outputs.lcov-path }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload HTML report
        if: ${{ steps.reports.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: ${{ steps.reports.outputs.html-dir }}
          if-no-files-found: error
          retention-days: 30